<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
   
     <style>
        .btn-primary {
            height: 3rem;
            border-radius: 0.75rem;
            --tw-bg-opacity: 1;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            font-weight: 700;
            --tw-text-opacity: 1;
            }
        nav li{
            position: relative;
        }
        nav li::after{
            content: "";
            width: 0;
            height: 2px;
            background-color: black;
            position: absolute;
            bottom: 0;
            left: 0;
            transition: width 0.3s ease;
        }
        nav li:hover::after{
            width: 100%;
        }
        body{
            background-image: url(image/Gemini_Generated_Image_m9uil8m9uil8m9ui.jpg);
        }

    </style>
</head>
<body class="text-amber-50 bg-black">
    <header class="w-[95%] md:w-[90%] mx-auto my-4 flex flex-col md:flex-row items-center justify-between gap-4">

        <!-- Logo -->
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-crown text-3xl text-amber-500"></i>

            <h1 class="font-bold text-2xl md:text-3xl">
                <span class="text-red-400">E</span>mpereur,
                <span class="text-blue-400">C</span>troyen,
                <span class="text-amber-400">E</span>sclave
            </h1>
        </div>
        <article id="player" class="w-75 p-2 m-2 flex items-center gap-4 font-bold ">
                
        </article>

        <!-- Navigation -->
        <nav class="flex items-center gap-4 md:gap-6 rounded-full bg-amber-100 text-black px-5 py-3 ">

            <ul class="flex items-center gap-4 md:gap-6">
                <li>
                    <a href="index.html"
                    class="font-medium  transition-colors">
                        Home
                    </a>
                </li>

                <li>
                    <a href="players.html"
                    class="font-medium  transition-colors">
                        Profiles
                    </a>
                </li>

                <li>
                    <a href="history.html"
                    class="font-medium  transition-colors">
                        History
                    </a>
                </li>
            </ul>

            <!-- Dark mode -->
            <button type="button"
                    class="border-l border-amber-300 pl-4 text-xl  transition-colors"
                    aria-label="Changer le thème">
                <i class="fa-regular fa-moon"></i>
            </button>

        </nav>
          

    </header>
    <hr class="w-[90%] mx-auto border-gray-200">
    
    <section class=" p-4 w-[95%] m-2 mx-auto">

        <h2 class="text-lg font-bold text-blue-200 mb-4">
            Game History
        </h2>

        <!-- Filters -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-4">

            <input
                type="text"
                id="searchPlayer"
                placeholder="⌕ Search by username..."
                class="bg-[#0b223d] border border-[#193b5c] rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-blue-400"
            >

            <select
                id="filterResult"
                class="bg-[#0b223d] border border-[#193b5c] rounded-lg px-3 py-2 text-sm text-white outline-none"
            >
                <option value="all">All Results</option>
                <option value="win">win</option>
                <option value="draw">draw</option>
                <option value="lose">lose</option>
            </select>

            <select
                id="filterDate"
                class="bg-[#0b223d] border border-[#193b5c] rounded-lg px-3 py-2 text-sm text-white outline-none"
            >
                <option value="all">All Time</option>
                <option value="today">Today</option>
                <option value="week">This Week</option>
                <option value="month">This Month</option>
            </select>

        </div>

        <!-- History Table -->
        <div class="rounded-lg border border-[#193b5c]">

            <table class="w-full text-left text-sm mx-auto text-blue-100">

                <thead class="bg-[#0b2038] text-blue-300">
                    <tr>
                        <th class="p-3 font-medium">Date</th>
                        <th class="p-3 font-medium">Player</th>
                        <th class="p-3 font-medium text-center">Score (P/C)</th>
                        <th class="p-3 font-medium text-center">Result</th>
                        <th class="p-3"></th>
                    </tr>
                </thead>

                <tbody id="historyList" class="divide-y divide-[#193b5c]">

                </tbody>
            </table>

        </div>
    </section>
<h1 id="error"></h1>
    
    <div id="deletePopup" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">

    <div class="bg-[#0b2038] border-2 border-[#c5a45e] rounded-xl p-6 w-full max-w-sm text-center shadow-2xl">

        <div class="text-4xl mb-3">⚠️</div>

        <h2 class="text-xl font-bold text-yellow-400 mb-3">
            Delete Game?
        </h2>

        <p class="text-gray-300 mb-6">
            Are you sure you want to delete this game from your history?
        </p>

        <div class="flex justify-center gap-3">

            <button id="confirmDelete"
                class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg font-semibold">
                Yes, Delete
            </button>

            <button id="cancelDelete"
                class="bg-gray-600 hover:bg-gray-700 text-white px-5 py-2 rounded-lg font-semibold">
                Cancel
            </button>

        </div>

        </div>
    </div>

    
    <div id="successPopup" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">

        <div class="bg-[#0b2038] border-2 border-yellow-500 rounded-xl p-6 w-full max-w-sm text-center shadow-2xl">

            <div class="text-5xl mb-3">✅</div>

            <h2 class="text-xl font-bold text-green-400 mb-3">
                Deleted Successfully!
            </h2>

            <p class="text-gray-300 mb-5">
                The game has been successfully deleted from your history.
            </p>


        </div>
    </div>

    <script type="module" src="src/history.js"></script>
</body>
</html>
