<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
    <style>
        main{
            background-image: url("image/Gemini_Generated_Image_m9uil8m9uil8m9ui.jpg");
        }
         .btn-primary {
            height: 3rem;
            border-radius: 0.75rem;
            --tw-bg-opacity: 1;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            font-weight: 700;
            --tw-text-opacity: 1;
            }

        .flip {
            transition:transform  0.6s;
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="text-amber-50 bg-black">
    <header class="w-[95%] md:w-[90%] mx-auto my-4 flex flex-col md:flex-row items-center justify-between gap-4">

        <!-- Logo -->
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-crown text-3xl text-amber-500"></i>

            <h1 class="font-bold text-2xl md:text-3xl">
                <span class="text-red-400">E</span>mpereur,
                <span class="text-blue-400">C</span>troyen,
                <span class="text-amber-400">E</span>sclave
            </h1>
        </div>
        <article id="player" class="w-75 p-2 m-2 flex items-center gap-4 font-bold ">
                
        </article>


    </header>

    <hr class="w-[90%] mx-auto border-gray-200">
    <main class="grid grid-cols-4">
        <aside class="border border-white rounded-2xl col-span-1 flex flex-col p-2 m-2">
            <div class="manch font-bold text-[20px] my-2 ">Manch <span id="cmpM">0</span>/12</div>
            <div class="group text-gray-400 mb-3">Groupe <span id="cmpG">1</span>/4</div>

            <div>
                <p class="font-bold text-[20px] my-2">Mon score</p>
                <p class="p-2 text-[50px] border-2 border-whit rounded-2xl cursor-pointer">👑 <span id="monS">0</span></p>
            </div>
            <div>
                <p class="font-bold text-[20px] my-2">Score ordinateur</p>
                <p class="p-2 text-[50px] border-2 border-whit rounded-2xl cursor-pointer">🤖 <span id="scoreO">0</span></p>
            </div>
        </aside>
        <section class="col-span-2 border border-white rounded-2xl p-2 m-2">
            <h1 class="text-center font-bold text-[20px] my-5 p-2 ">Choisis une carte</h1>
            <p class="font-bold my-2 p-1">Main de l'ordinateur</p>
            <div id="mainCarts" class="flex gap-3 p-3 my-3 justify-center">
                
            </div>
            <p class="font-bold my-2 p-1">Ta main</p>
            <div id="meCarts" class="flex gap-3 p-3 my-3 justify-center">
                

            </div>
        </section>
        <aside class="col-span-1 flex flex-col items-center border border-white rounded-2xl p-2 m-2">
            <h1 class="text-[22px] font-bold text-center my-4">Duel !</h1>
            <div class="flex gap-3 items-center justify-center my-5">
                <img id="main" src="" alt="" class="h-47 rounded-2xl">
                <h1>VS</h1>
                <img id="ordinateur" src="" alt="" class="h-47 rounded-2xl">
            </div>
            <div class="flex flex-col justify-center items-center p-3 my-5 w-70 border border-white rounded-2xl gap-3">
                <div class="case">🏆 Win</div>
                <p>Lorem ipsum dolor sit amet consect adipisicing elit</p>
                <button class="btn-primary bg-blue-600">Continuer</button>
            </div>

        </aside>
    </main>
    <script type="module" src="src/game.js"></script>
</body>
</html>
