<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
    <style>
        main{
            background-image: url("image/Gemini_Generated_Image_m9uil8m9uil8m9ui.jpg");
        }
         .btn-primary {
            height: 3rem;
            border-radius: 0.75rem;
            --tw-bg-opacity: 1;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            font-weight: 700;
            --tw-text-opacity: 1;
            }

        .flip {
            transition:transform  0.6s;
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="text-amber-50 bg-black">
    <header class="w-[95%] md:w-[90%] mx-auto my-4 flex flex-col md:flex-row items-center justify-between gap-4">

        <!-- Logo -->
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-crown text-3xl text-amber-500"></i>

            <h1 class="font-bold text-2xl md:text-3xl">
                <span class="text-red-400">E</span>mpereur,
                <span class="text-blue-400">C</span>troyen,
                <span class="text-amber-400">E</span>sclave
            </h1>
        </div>
        <article id="player" class="w-75 p-2  flex items-center gap-4 font-bold ">
                
        </article>


    </header>

    <hr class="w-[90%] mx-auto border-gray-200">
    <main class="grid grid-cols-1 md:grid-cols-4">
        <aside class="border border-white rounded-2xl md:col-span-1 flex flex-col p-2 m-2">
            
            <div class="flex justify-around md:flex-col">
                <div class="manch font-bold text-[20px] my-2 ">Manch <span id="rounds">0</span>/12</div>
            <div class="group text-gray-400 my-2 md:mb-3">Groupe <span id="groupe">1</span>/4</div>
            </div>

            <div class="flex md:flex-col justify-between">
                <div>
                <p class="font-bold text-[20px] my-2">Mon score</p>
                <p class="p-2 text-[25px] md:text-[50px] md:border-2 border-whit rounded-2xl cursor-pointer">👑 <span id="monS">0</span></p>
            </div>
            <div>
                <p class="font-bold text-[20px] my-2">Score ordinateur</p>
                <p class="p-2 text-[25px] md:text-[50px] md:border-2 border-whit rounded-2xl cursor-pointer">🤖 <span id="scoreO">0</span></p>
            </div>
            </div>
        </aside>
        <aside class="md:col-span-1 flex flex-col items-center border border-white rounded-2xl p-2 m-2">
            <h1 class="text-[22px] font-bold text-center my-4">Duel !</h1>
            <div class="flex gap-3 items-center justify-center my-5">
                <img id="main" src="" alt="" class="h-25 md:h-35 rounded-2xl">
                <h1>VS</h1>
                <img id="ordinateur" src="" alt="" class="h-25 md:h-35 rounded-2xl">
            </div>
            <div class="flex flex-col justify-center items-center p-3 my-5 w-70 border border-white rounded-2xl gap-3">
                <div class="result">Start Game</div>
               
            </div>

        </aside>
        <section class="md:col-span-2 border border-white rounded-2xl p-2 m-2">
            <h1 class="text-center font-bold text-[20px] my-5 p-2 ">Choisis une carte</h1>
            <p class="font-bold md:my-2 p-1">Main de l'ordinateur</p>
            <div id="mainCarts" class="flex gap-3 p-3 md:my-3 justify-center ">
                
            </div>
            <p class="font-bold md:my-2 p-1">Ta main</p>
            <div id="meCarts" class="flex gap-3 p-3 md:my-3 justify-center">
                

            </div>
        </section>

    </main>
     <div id="result" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">

        <div class="bg-white w-100 p-2 rounded-2xl p-8 shadow-2xl text-center">

            <h2 class="text-3xl font-bold text-gray-800 mb-2">
                Game Over!
            </h2>

            <p id="casePlayer" class="text-xl font-bold text-yellow-600 mb-6">
                Player Wins!
            </p>

            <!-- Final Score -->
            <div class="bg-gray-100 rounded-xl p-5 mb-6">

                <h3 class="text-lg font-bold text-gray-700 mb-4">
                    Final Score
                </h3>

                <div class="flex justify-between items-center mb-4">
                    <span class="font-semibold text-gray-700">
                        👤 Player
                    </span>
                    <span id="finalPlayerScore" class="font-bold text-2xl text-blue-600">
                        0
                    </span>
                </div>

                <div class="flex justify-between items-center">
                    <span class="font-semibold text-gray-700">
                        🤖 Computer
                    </span>
                    <span id="finalComputerScore" class="font-bold text-2xl text-red-500">
                        0
                    </span>
                </div>

            </div>

            <!-- Buttons -->
            <div class="flex gap-3">

                <button id="replay" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl">
                    🔄 Play Again
                </button>

                <button id="quit" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-xl">
                    <a href="players.html">Quit Game</a>
                </button>

            </div>

        </div>
    </div>
    <script type="module" src="src/game.js"></script>
</body>
</html>
